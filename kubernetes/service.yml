apiVersion: v1
kind: Service
metadata:
  name: portfolio-service
spec:
  type: NodePort           # exposes the service on a port of the node
  selector:
    app: portfolio         # send traffic to pods with this label
  ports:
    - protocol: TCP
      port: 80             # the port the service listens on
      targetPort: 80       # the port on the pod to forward to
      nodePort: 30080      # the port exposed on the Minikube node