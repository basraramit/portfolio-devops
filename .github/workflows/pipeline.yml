name: Build and Deploy Portfolio

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/portfolio-devops:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/portfolio-devops:${{ github.sha }}

      - name: Verify image on Docker Hub
        run: |
          echo "Image pushed: ${{ secrets.DOCKERHUB_USERNAME }}/portfolio-devops:${{ github.sha }}"
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/portfolio-devops:latest
          echo "Image verified successfully"

      - name: Update Kubernetes manifest with new image tag
        run: |
          sed -i "s|YOUR_DOCKERHUB_USERNAME/portfolio-devops:.*|${{ secrets.DOCKERHUB_USERNAME }}/portfolio-devops:${{ github.sha }}|g" kubernetes/deployment.yml
          echo "Updated deployment.yml with tag: ${{ github.sha }}"
          cat kubernetes/deployment.yml

      - name: Commit updated manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
          git add kubernetes/deployment.yml
          git diff --staged --quiet || git commit -m "ci: update image tag to ${{ github.sha }}"
          git diff --staged --quiet || git push