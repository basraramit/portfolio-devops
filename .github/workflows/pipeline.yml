name: Build and Deploy Portfolio

# Trigger this pipeline on every push to the main branch
on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest          # GitHub provides this Linux machine

    steps:

      # Step 1: Check out the repository code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Log in to Docker Hub using your secrets
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Step 3: Build and push the Docker image
      # Two tags: 'latest' and the specific git commit hash
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/portfolio:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/portfolio:${{ github.sha }}

      # Step 4: Verify the image was pushed successfully
      - name: Verify image on Docker Hub
        run: |
          echo "Image pushed: ${{ secrets.DOCKERHUB_USERNAME }}/portfolio:${{ github.sha }}"
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/portfolio:latest
          echo "Image verified successfully"

      # Step 5: Update the Kubernetes deployment file to use the new image tag
      # This ensures every deploy uses a specific, traceable image
      - name: Update Kubernetes manifest with new image tag
        run: |
          sed -i "s|YOUR_DOCKERHUB_USERNAME/portfolio:.*|${{ secrets.DOCKERHUB_USERNAME }}/portfolio:${{ github.sha }}|g" kubernetes/deployment.yml
          echo "Updated deployment.yml with tag: ${{ github.sha }}"
          cat kubernetes/deployment.yml

      # Step 6: Commit the updated manifest back to the repo
      # This keeps your repo in sync with what is actually deployed
      - name: Commit updated manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add kubernetes/deployment.yml
          git diff --staged --quiet || git commit -m "ci: update image tag to ${{ github.sha }}"
          git push